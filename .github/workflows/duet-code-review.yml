name: Duet autonomous code review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: duet-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore duet memory + TurnState
        uses: actions/cache@v4
        with:
          path: .duet-ci
          key: duet-ci-${{ github.repository }}-base-${{ github.base_ref }}-v1
          restore-keys: |
            duet-ci-${{ github.repository }}-base-${{ github.base_ref }}-

      - name: Prepare review brief
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/prepare-review-context.sh

      - name: Install dependencies
        run: npm install

      - name: Run autonomous reviewer
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          CONTEXT_PATH: ${{ github.workspace }}/.review-context/review-brief.md
          REVIEW_OUTPUT_PATH: ${{ github.workspace }}/.review-context/REVIEW.md
          MEMORY_DB_PATH: ${{ github.workspace }}/.duet-ci/memory.db
          TURN_STATE_PATH: ${{ github.workspace }}/.duet-ci/turn-state.json
        run: npm run review

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.review-context/REVIEW.md';
            let body;
            try {
              body = fs.readFileSync(path, 'utf8');
            } catch (e) {
              core.setFailed('Missing REVIEW.md');
              return;
            }
            const marker = '<!-- duet-autonomous-review -->';
            const payload = `${marker}\n## Autonomous review (duet-agent)\n\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }
