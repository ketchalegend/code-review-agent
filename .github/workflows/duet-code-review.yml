name: Duet autonomous code review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    secrets:
      DEEPSEEK_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
    inputs:
      tooling_repository:
        description: owner/name of repo that hosts package.json, src/, scripts/
        type: string
        required: false
        default: ketchalegend/code-review-agent
      tooling_ref:
        description: Git ref (branch or tag) for tooling checkout
        type: string
        required: false
        default: main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: duet-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tooling paths
        id: tooling_paths
        env:
          TOOLING_REPOSITORY: ${{ inputs.tooling_repository || 'ketchalegend/code-review-agent' }}
          TOOLING_REF: ${{ inputs.tooling_ref || 'main' }}
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TOOL_LOWER=$(echo "$TOOLING_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "tooling_repository=$TOOLING_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "tooling_ref=$TOOLING_REF" >> "$GITHUB_OUTPUT"
          if [ "$REPO_LOWER" = "$TOOL_LOWER" ]; then
            echo "tooling_root=." >> "$GITHUB_OUTPUT"
            echo "needs_tooling_checkout=false" >> "$GITHUB_OUTPUT"
          else
            echo "tooling_root=.review-tooling" >> "$GITHUB_OUTPUT"
            echo "needs_tooling_checkout=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tooling_paths.outputs.needs_tooling_checkout == 'true'
        with:
          repository: ${{ steps.tooling_paths.outputs.tooling_repository }}
          ref: ${{ steps.tooling_paths.outputs.tooling_ref }}
          path: .review-tooling

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore duet memory + TurnState
        uses: actions/cache@v4
        with:
          path: .duet-ci
          key: duet-ci-${{ github.repository }}-base-${{ github.base_ref }}-v2
          restore-keys: |
            duet-ci-${{ github.repository }}-base-${{ github.base_ref }}-

      - name: Prepare review brief
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash "${{ steps.tooling_paths.outputs.tooling_root }}/scripts/prepare-review-context.sh"

      - name: Install dependencies
        working-directory: ${{ steps.tooling_paths.outputs.tooling_root }}
        run: npm ci

      - name: Run autonomous reviewer
        working-directory: ${{ steps.tooling_paths.outputs.tooling_root }}
        env:
          REVIEW_WORKING_DIRECTORY: ${{ github.workspace }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # vars.REVIEW_MODEL is often "" when unset; empty env breaks duet (?? does not treat "" as missing).
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'deepseek:deepseek-v4-flash' }}
          # Optional override for observational-memory extraction; blank → run-review uses REVIEW_MODEL.
          MEMORY_MODEL: ${{ vars.MEMORY_MODEL }}
          CONTEXT_PATH: ${{ github.workspace }}/.review-context/review-brief.md
          REVIEW_OUTPUT_PATH: ${{ github.workspace }}/.review-context/REVIEW.md
          MEMORY_DB_PATH: ${{ github.workspace }}/.duet-ci/memory.db
          TURN_STATE_PATH: ${{ github.workspace }}/.duet-ci/turn-state.json
        run: npm run review

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.review-context/REVIEW.md';
            let body;
            try {
              body = fs.readFileSync(path, 'utf8');
            } catch (e) {
              core.setFailed('Missing REVIEW.md');
              return;
            }
            const marker = '<!-- duet-autonomous-review -->';
            const payload = `${marker}\n## Autonomous review (duet-agent)\n\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }
